<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 식물 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2FAF6; --card:#FFFFFF; --ink:#223A34; --ink-soft:#5B7A70;
    --green:#2FA36B; --green-dark:#1F7A50; --sun:#FFC24B; --coin:#E8A93A;
    --line:#DCEFE6; --coral:#FF7B72; --teal:#22B8A6; --danger:#E15252; --sky:#3FA9D6;
    --radius:20px; --shadow:0 8px 24px rgba(34,58,52,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(circle at 12% 8%,#E4F5EC 0%,transparent 45%),radial-gradient(circle at 90% 0%,#EAF6FB 0%,transparent 40%),var(--bg);
    font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh; padding:18px 12px 60px;}
  .wrap{max-width:640px; margin:0 auto;}
  header{text-align:center; margin-bottom:14px;}
  header h1{font-family:'Baloo 2',sans-serif; font-size:clamp(22px,5vw,30px); margin:0 0 4px; color:var(--green-dark); letter-spacing:-.5px;}
  header p{margin:0; color:var(--ink-soft); font-size:14px;}

  .login-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 22px; text-align:center; max-width:340px; margin:30px auto;}
  .login-card h2{font-family:'Baloo 2',sans-serif; margin:0 0 6px; font-size:19px;}
  .login-card p{color:var(--ink-soft); font-size:13px; margin:0 0 18px;}
  .pin-input{width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); font-size:24px; text-align:center; letter-spacing:10px; font-weight:800;}
  .pin-err{color:var(--danger); font-size:12.5px; font-weight:700; height:16px; margin-top:8px;}
  .login-btn{width:100%; margin-top:12px; border:none; background:var(--green); color:#fff; font-weight:800; padding:12px; border-radius:12px; cursor:pointer; font-family:'Baloo 2',sans-serif; font-size:15px;}

  .top-bar{display:flex; align-items:center; justify-content:space-between; margin:14px 0; flex-wrap:wrap; gap:8px;}
  .top-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .role-chip{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px;}
  .logout-btn{border:none; background:none; color:var(--ink-soft); font-size:12.5px; font-weight:800; text-decoration:underline; cursor:pointer;}
  .parent-tabs{display:flex; gap:8px;}
  .parent-tab{border:2px solid var(--line); background:var(--card); padding:7px 14px; border-radius:999px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .parent-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; border:1px solid var(--line); margin-bottom:14px;}

  .companion-name-row{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;}
  .companion-name{font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:800;}
  .rename-btn{border:none; background:var(--line); color:var(--ink-soft); font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:999px; cursor:pointer;}
  .weather-line{font-size:12.5px; color:var(--ink-soft); font-weight:700; text-align:center; margin-top:2px;}
  .weather-reason{font-size:11.5px; color:var(--ink-soft); text-align:center; opacity:.85; margin-top:1px;}

  .grow-scene{position:relative; width:100%; height:320px; border-radius:20px; overflow:hidden; margin:4px 0 10px;
    background:radial-gradient(circle at 30% 20%,#EFF9F1 0%,#DCEEE0 40%,#CFE6D6 100%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .grow-scene .bokeh{position:absolute; border-radius:50%; filter:blur(2px); opacity:.55;}
  .grow-table{position:absolute; left:0; right:0; bottom:0; height:78px;
    background:linear-gradient(180deg,#E7C89A 0%,#D9B37E 55%,#C89C63 100%); border-radius:0 0 20px 20px;}
  .grow-table:before{content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(0,0,0,.04) 0 2px, transparent 2px 46px);}
  .points-chip{position:absolute; top:10px; left:10px; background:rgba(255,255,255,.9); border-radius:999px; padding:6px 12px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; color:var(--ink); box-shadow:0 3px 8px rgba(0,0,0,.12); z-index:6;}
  .need-bubble{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:#fff; color:var(--ink); padding:7px 13px; border-radius:16px;
    font-size:12.5px; font-weight:800; white-space:nowrap; box-shadow:0 5px 14px rgba(0,0,0,.15); z-index:7; animation:bubblefloat 1.8s ease-in-out infinite;}
  .need-bubble:after{content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); border-width:6px 6px 0; border-style:solid; border-color:#fff transparent transparent;}
  @keyframes bubblefloat{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-5px);}}

  .gauge-vert{position:absolute; left:12px; top:64px; width:46px; display:flex; flex-direction:column; align-items:center; z-index:6;}
  .gauge-vert .gv-icon{font-size:20px; margin-bottom:2px;}
  .gauge-vert .gv-num{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; color:var(--coin); margin-bottom:4px;}
  .gauge-vert .gv-track{width:16px; height:100px; background:rgba(255,255,255,.6); border-radius:999px; overflow:hidden; display:flex; align-items:flex-end; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
  .gauge-vert .gv-fill{width:100%; background:linear-gradient(180deg,#FFD873,var(--coin)); border-radius:999px; transition:height .4s ease;}
  .gauge-vert .gv-label{font-size:9.5px; color:var(--ink-soft); font-weight:700; margin-top:4px; text-align:center;}

  .icon-stack{position:absolute; right:10px; top:48px; display:flex; flex-direction:column; gap:7px; z-index:6;}
  .icon-stack-btn{position:relative; width:42px; height:42px; border-radius:13px; background:rgba(255,255,255,.92); border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.12); font-size:16px; gap:1px;}
  .icon-stack-btn .lbl{font-size:7.5px; font-weight:800; color:var(--ink-soft);}
  .icon-stack-btn .dot{position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 2px #fff;}
  .icon-stack-btn:disabled{opacity:.4;}
  .harvest-fab{position:absolute; left:12px; top:16px; z-index:6; width:44px; height:44px; border-radius:14px; background:linear-gradient(135deg,var(--sun),var(--coin));
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 10px rgba(0,0,0,.18); animation:pulse 1.4s ease-in-out infinite;}

  .pot-wrap{position:absolute; left:50%; bottom:56px; transform:translateX(-50%); width:170px; height:217px; z-index:3; display:flex; align-items:flex-end; justify-content:center;}
  .pot-cup{position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); width:96px; height:34px; z-index:2;
    background:linear-gradient(180deg,#FFFFFF 0%,#EDEAE2 100%); border-radius:0 0 30px 30px; box-shadow:0 4px 8px rgba(0,0,0,.15);}
  .pot-cup:before{content:''; position:absolute; top:-6px; left:0; width:100%; height:12px; background:#F7F5EE; border-radius:50%;}

  .level-name-row{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:6px;}
  .level-star{background:var(--sun); color:#5A3D00; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12px; border-radius:999px; padding:2px 8px;}
  .weather-reason-sm{font-size:11px; color:var(--ink-soft); text-align:center; opacity:.8; margin-top:1px;}

  .pet-visual{width:170px; height:217px; display:flex; align-items:center; justify-content:center; position:relative; overflow:visible; cursor:pointer;
    margin:0 auto;}
  .pet-visual .glow-bg{position:absolute; inset:-16px; border-radius:50%; opacity:0; transition:opacity .5s ease; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 50% 50%,transparent 0%,transparent 52%,#FFE49A 64%,transparent 78%);}
  .pet-visual.glow .glow-bg{opacity:1; animation:glowpulse 2.6s ease-in-out infinite;}
  @keyframes glowpulse{0%,100%{transform:scale(1); opacity:.7;}50%{transform:scale(1.07); opacity:1;}}
  .char-sprite{width:100%; height:100%; position:relative; z-index:1; display:flex; align-items:center; justify-content:center;}
  .pet-visual.leveled .char-sprite{animation:pop .6s ease;}
  .char-sprite.type-tree svg{animation:charsway 3.2s ease-in-out infinite; transform-origin:50% 92%;}
  .char-sprite svg{animation:charbob 2.8s ease-in-out infinite;}
  @keyframes charsway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes charbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .fx-squish{animation:fxsquish .5s ease;}
  @keyframes fxsquish{0%,100%{transform:scaleY(1) scaleX(1);}40%{transform:scaleY(.82) scaleX(1.12);}}
  .fx-bounce{animation:fxbounce .6s ease;}
  @keyframes fxbounce{0%,100%{transform:translateY(0);}30%{transform:translateY(-18px);}55%{transform:translateY(0);}75%{transform:translateY(-6px);}}
  .fx-spin{animation:fxspin .6s ease;}
  @keyframes fxspin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .fx-brighten{animation:fxbrighten 1s ease;}
  @keyframes fxbrighten{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
  .fx-lean{animation:fxlean .7s ease;}
  @keyframes fxlean{0%,100%{transform:translateX(0);}50%{transform:translateX(8px);}}
  .flower-dot-2d{animation:bloom2d 2.4s ease-in-out infinite; transform-origin:center;}
  @keyframes bloom2d{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  @keyframes pop{0%{transform:scale(1) rotate(0);}35%{transform:scale(1.2) rotate(-4deg);}60%{transform:scale(.94) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  .use-hint{text-align:center; font-size:12.5px; font-weight:800; color:var(--sky); min-height:16px;}
  .float-plus{position:fixed; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; color:var(--green-dark); pointer-events:none; z-index:96;}

  .action-bar-4{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .action-btn{border:none; border-radius:14px; padding:10px 4px; text-align:center; cursor:pointer; background:#FAFDFB; border:1.5px solid var(--line);}
  .action-btn .ic{font-size:20px;}
  .action-btn .n{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; margin-top:2px;}
  .action-btn .l{font-size:10px; color:var(--ink-soft); font-weight:700;}
  .action-btn.primary{background:linear-gradient(135deg,var(--sky),#2F8FC4); border-color:transparent;}
  .action-btn.primary .n, .action-btn.primary .l{color:#fff;}
  .action-btn:disabled{opacity:.45; cursor:not-allowed;}

  .ring-pulse{position:fixed; top:0; left:0; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; pointer-events:none; z-index:96;
    border:3px solid; animation:ringpulse .8s ease-out forwards;}
  @keyframes ringpulse{0%{transform:scale(0.3); opacity:1;}100%{transform:scale(9); opacity:0;}}
  .ribbon-piece{position:fixed; top:-20px; left:0; width:5px; height:22px; border-radius:2px; pointer-events:none; z-index:96; animation:ribbonfall linear forwards;}
  @keyframes ribbonfall{0%{transform:translateY(0) rotate(0deg); opacity:1;}100%{transform:translateY(420px) rotate(600deg); opacity:0;}}

  .progress-track{width:100%; height:11px; background:var(--line); border-radius:999px; overflow:hidden; margin:6px 0 4px;}
  .progress-fill{height:100%; border-radius:999px; transition:width .4s ease; background-size:200% 100% !important;
    background-image:linear-gradient(90deg,currentColor 0%,rgba(255,255,255,.55) 50%,currentColor 100%); animation:shimmer 1.8s linear infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-20% 0;}}
  .progress-text{font-size:11.5px; color:var(--ink-soft); font-weight:700; text-align:center;}
  .points-big{font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:800; text-align:center;}
  .points-label{font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-top:-4px; text-align:center;}

  .item-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px;}
  .item-card{background:#FAFDFB; border:1px solid var(--line); border-radius:14px; padding:10px 5px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .item-card .ic{font-size:22px;}
  .item-card .n{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px;}
  .item-card .l{font-size:10px; color:var(--ink-soft); font-weight:700;}
  .use-btn{margin-top:2px; border:none; background:var(--sky); color:#fff; font-weight:800; font-size:11px; padding:5px 10px; border-radius:999px; cursor:pointer;}
  .use-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .use-btn.selected{background:var(--green-dark);}

  .goal-card{border-radius:16px; padding:14px; border:1.5px dashed var(--line); margin-top:10px;}
  .goal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .goal-title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;}
  .goal-reward{font-size:12.5px; font-weight:800; color:var(--coin);}
  .harvest-btn{width:100%; margin-top:8px; border:none; padding:10px; border-radius:12px; font-family:'Baloo 2',sans-serif; font-weight:800; cursor:pointer; background:var(--line); color:var(--ink-soft);}
  .harvest-btn.ready{background:linear-gradient(90deg,var(--sun),var(--coin)); color:#5A3D00; animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
  .harvest-btn.done{background:#EAF8EF; color:var(--green-dark);}

  .mission-btn-row{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .test-btn{border:1.5px solid #F0D8A8; background:#fff; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:800; color:#8A5A1E; cursor:pointer;}
  .test-btn:active{transform:scale(.95);}
  .mission-btn{flex:1; min-width:110px; border:none; background:var(--green); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px; padding:14px 8px; border-radius:14px; cursor:pointer; position:relative;}
  .mission-btn.bonus{background:var(--sun); color:#5A3D00;}
  .mission-btn.special{background:linear-gradient(90deg,#FF9A8B,#FF6A88); color:#fff;}
  .mission-btn .cnt{position:absolute; top:-6px; right:-6px; background:#fff; color:var(--ink); border-radius:999px; font-size:11px; padding:2px 6px; box-shadow:0 2px 6px rgba(0,0,0,.15);}

  .section-title{font-family:'Baloo 2',sans-serif; font-size:15.5px; font-weight:700; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .badge-count{background:var(--line); color:var(--green-dark); font-size:12px; padding:2px 9px; border-radius:999px; font-weight:800;}

  .task-list{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:8px;}
  .task-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:#FAFDFB; border:1px solid var(--line);}
  .task-text{flex:1; font-weight:700; font-size:14px;}
  .task-pts{font-size:11.5px; font-weight:800; color:var(--green-dark); background:#E7F7EE; padding:3px 8px; border-radius:999px; white-space:nowrap;}
  .bonus-item .task-pts{background:#FFF3DE; color:#B4790C;}
  .status-pill{font-size:11.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; border:none; cursor:pointer;}
  .status-idle{background:var(--green); color:#fff;}
  .status-pending{background:#FFF3DE; color:#B4790C; cursor:default;}
  .status-done{background:var(--line); color:var(--ink-soft); cursor:default;}
  .del-btn{border:none; background:none; color:#C7C7C7; font-size:15px; cursor:pointer; padding:2px 4px;}
  .del-btn:hover{color:var(--coral);}

  .add-row{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; align-items:center;}
  .add-row input[type=text]{flex:1; min-width:120px; padding:9px 12px; border-radius:12px; border:1.5px solid var(--line); font-size:14px;}
  .add-row input[type=number]{width:64px; padding:9px 8px; border-radius:12px; border:1.5px solid var(--line); font-size:14px; text-align:center;}
  .add-row button{border:none; background:var(--green); color:#fff; font-weight:800; padding:9px 14px; border-radius:12px; cursor:pointer; font-family:'Baloo 2',sans-serif;}
  .tier-picker{display:flex; gap:5px;}
  .tier-opt{border:2px solid var(--line); background:#fff; border-radius:10px; padding:6px 9px; font-size:12px; font-weight:800; cursor:pointer;}
  .tier-opt.sel{border-color:var(--green); background:#EAF8EF; color:var(--green-dark);}

  .divider{height:1px; background:var(--line); margin:16px 0;}

  .pending-card{display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:14px; background:#FAFDFB; border:1px solid var(--line); margin-bottom:10px;}
  .pending-thumb{width:60px; height:60px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#eee;}
  .pending-info{flex:1;}
  .pending-name{font-weight:800; font-size:12.5px; color:var(--ink-soft);}
  .pending-text{font-weight:700; font-size:14px; margin:2px 0;}
  .pending-actions{display:flex; gap:6px; margin-top:8px;}
  .approve-btn,.reject-btn{border:none; padding:7px 14px; border-radius:10px; font-weight:800; font-size:13px; cursor:pointer;}
  .approve-btn{background:var(--green); color:#fff;}
  .reject-btn{background:#FFECEC; color:var(--danger);}

  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .settings-grid label{font-size:12px; font-weight:800; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .settings-grid input{width:100%; padding:8px 10px; border-radius:10px; border:1.5px solid var(--line); font-size:14px;}
  .save-btn{margin-top:10px; border:none; background:var(--green-dark); color:#fff; font-weight:800; padding:9px 18px; border-radius:12px; cursor:pointer; font-family:'Baloo 2',sans-serif;}

  .type-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .type-opt{flex:1; min-width:70px; padding:12px 6px; border-radius:14px; border:2px solid var(--line); background:#fff; text-align:center; cursor:pointer; font-weight:800; font-size:13px;}
  .type-opt .e{font-size:26px; display:block; margin-bottom:2px;}
  .type-opt.sel{border-color:var(--green); background:#EAF8EF; color:var(--green-dark);}

  .history-log{font-size:12.5px; color:var(--ink-soft); line-height:1.9;}
  .empty-note{color:var(--ink-soft); font-size:13px; padding:6px 2px;}

  .overlay{position:fixed; inset:0; background:rgba(20,40,32,.4); display:none; align-items:center; justify-content:center; z-index:90; padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:20px; padding:0; width:100%; max-width:400px; max-height:82vh; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.2); display:flex; flex-direction:column;}
  .modal-head{padding:16px 20px; display:flex; align-items:center; justify-content:space-between;}
  .modal-head h3{margin:0; font-family:'Baloo 2',sans-serif; font-size:17px; color:#fff;}
  .modal-head.theme-blue{background:linear-gradient(135deg,#4FB6E8,#2F8FC4);}
  .modal-head.theme-yellow{background:linear-gradient(135deg,#FFD873,#F0B429); }
  .modal-head.theme-yellow h3{color:#5A3D00;}
  .modal-head.theme-yellow .modal-close{color:#5A3D00; background:rgba(0,0,0,.12);}
  .modal-head.theme-pink{background:linear-gradient(135deg,#FF9AB0,#FF6A88);}
  .modal-body-inner{padding:16px 20px 20px; overflow-y:auto;}
  .modal h3{font-family:'Baloo 2',sans-serif; margin:0 0 12px; font-size:17px;}
  .modal-close{border:none; background:rgba(255,255,255,.35); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; color:#fff; flex-shrink:0;}
  .special-box{background:#FFF5F3; border-radius:14px; padding:14px; text-align:center;}
  .special-box .amt{font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; color:#FF6A88; margin:6px 0;}
  .special-submit-btn{margin-top:12px; width:100%; border:none; background:#FF6A88; color:#fff; font-weight:800; padding:11px; border-radius:12px; cursor:pointer; font-family:'Baloo 2',sans-serif;}

  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-nav button{border:none; background:var(--line); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--ink-soft);}
  .cal-nav .ym{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:11px; font-weight:800; color:var(--ink-soft); padding-bottom:4px;}
  .cal-day{position:relative; aspect-ratio:1; border-radius:10px; border:none; background:#FAFDFB; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  .cal-day.empty{background:none; cursor:default;}
  .cal-day.today{box-shadow:0 0 0 2px var(--sky) inset;}
  .cal-day .cdot{width:6px; height:6px; border-radius:50%; background:var(--green);}
  .cal-day-detail-item{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:#FAFDFB; border:1px solid var(--line); margin-bottom:6px; font-size:13px; font-weight:700;}
  .cal-day-detail-item.miss{opacity:.55; text-decoration:line-through;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--green-dark); color:#fff;
    padding:12px 20px; border-radius:14px; font-weight:800; font-family:'Baloo 2',sans-serif; font-size:14px; opacity:0; pointer-events:none;
    transition:all .3s ease; z-index:95; box-shadow:0 10px 26px rgba(0,0,0,.2); max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .fx-layer{position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:5;}
  .raindrop{position:absolute; top:-10px; width:5px; height:14px; border-radius:3px; background:#5FB6E8; opacity:.9; animation:rainfall .7s ease-in forwards;}
  @keyframes rainfall{0%{transform:translateY(-20px); opacity:0;}20%{opacity:.9;}100%{transform:translateY(150px); opacity:0;}}
  .falling-icon{position:absolute; top:-14px; font-size:19px; animation:rainfall .8s ease-in forwards;}
  .day-picker{display:flex; gap:4px; flex-wrap:wrap;}
  .day-opt{border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:5px 7px; font-size:11.5px; font-weight:800; cursor:pointer; color:var(--ink-soft);}
  .day-opt.sel{border-color:var(--teal); background:#EAF6F5; color:var(--teal);}
  .nutrient-bubble{position:absolute; top:-6px; left:50%; transform:translateX(-50%) scale(.6); background:#fff; color:var(--ink);
    padding:6px 12px; border-radius:14px; font-size:12.5px; font-weight:800; white-space:nowrap; box-shadow:0 6px 16px rgba(0,0,0,.12);
    opacity:0; animation:bubblepop 1.8s ease forwards;}
  .nutrient-bubble:after{content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); border-width:6px 6px 0; border-style:solid; border-color:#fff transparent transparent;}
  @keyframes bubblepop{0%{opacity:0; transform:translateX(-50%) scale(.5) translateY(6px);}20%{opacity:1; transform:translateX(-50%) scale(1.05) translateY(0);}
    30%{transform:translateX(-50%) scale(1) translateY(0);}80%{opacity:1;}100%{opacity:0; transform:translateX(-50%) scale(1) translateY(-10px);}}
</style>

<body>
<div class="wrap">
  <header>
    <h1>🌱 우리집 식물 키우기</h1>

  <div id="loginScreen">

      <h2>🔐 PIN 번호 입력</h2>

      <input type="password" inputmode="numeric" maxlength="6" class="pin-input" id="loginPinInput" placeholder="••••">

</div>

<input type="file" id="hiddenFileInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="backupFileInput" accept="application/json" style="display:none">

<div class="overlay" id="missionModal">
  <div class="modal" id="missionModalBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= constants (plant growing, multiple species) ================= */
const STAGE_THRESHOLDS=[0,20,50,100,180,300];
const PLANT_SPECIES_LIST=['tree','succulent','cactus','sunflower','rose','tomato'];
const COMPANION_LABEL={tree:'나무',succulent:'다육이',cactus:'선인장',sunflower:'해바라기',rose:'장미',tomato:'방울토마토'};
const COMPANION_EMOJI={tree:'🌳',succulent:'🪴',cactus:'🌵',sunflower:'🌻',rose:'🌹',tomato:'🍅'};
const STAGE_NAMES_SHARED=['씨앗','새싹','자라는 중','무럭무럭','꽃(열매)을 맺어요','활짝 자랐어요'];
const STAGE_NAMES_BY_TYPE={tree:STAGE_NAMES_SHARED,succulent:STAGE_NAMES_SHARED,cactus:STAGE_NAMES_SHARED,sunflower:STAGE_NAMES_SHARED,rose:STAGE_NAMES_SHARED,tomato:STAGE_NAMES_SHARED};
const ITEM_DEFS_SHARED=[{icon:'💧',label:'물방울',value:1},{icon:'🌿',label:'영양제',value:5},{icon:'✨',label:'마법거름',value:10}];
const ITEM_DEFS={tree:ITEM_DEFS_SHARED,succulent:ITEM_DEFS_SHARED,cactus:ITEM_DEFS_SHARED,sunflower:ITEM_DEFS_SHARED,rose:ITEM_DEFS_SHARED,tomato:ITEM_DEFS_SHARED};
const FUN_ACTIONS_SHARED=[{label:'🎵 노래해주기',key:'notes',emoji:'🎵'},{label:'🤗 안아주기',key:'hug',emoji:'💗'},{label:'☀️ 햇살쐬기',key:'rays',emoji:'☀️'}];
const FUN_ACTIONS={tree:FUN_ACTIONS_SHARED,succulent:FUN_ACTIONS_SHARED,cactus:FUN_ACTIONS_SHARED,sunflower:FUN_ACTIONS_SHARED,rose:FUN_ACTIONS_SHARED,tomato:FUN_ACTIONS_SHARED};
const STORAGE_KEY='money-tree-state-v4';
const MAX_PHOTO_LOG=20;

function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function todayKey(){return new Date().toDateString();}
function getWeekKey(d){
  const date=new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-((date.getDay()+6)%7));
  const week1=new Date(date.getFullYear(),0,4);
  const weekNo=1+Math.round(((date-week1)/86400000-3+((week1.getDay()+6)%7))/7);
  return date.getFullYear()+'-W'+weekNo;
}
function getMonthKey(d){const dt=new Date(d); return dt.getFullYear()+'-'+(dt.getMonth()+1);}
function todayDow(){ const now=new Date(); return ((now.getDay()+6)%7)+1; }
function dateKeyOf(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function dowOfDateKey(key){ const [y,m,d]=key.split('-').map(Number); const dt=new Date(y,m-1,d); return ((dt.getDay()+6)%7)+1; }
const WEEKDAY_LABELS=['\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0','\uc77c'];

function defaultChild(pin,name,grade,companionType,tasks,bonus,weeklyReward,monthlyReward){
  return {
    pin, name, grade, companionType, customName:COMPANION_LABEL[companionType],
    points:0, items:{1:0,2:0,3:0}, affectionCount:0,
    tasks: tasks.map(t=>({id:uid(), text:t[0], tier:t[1], count:t[2], state:'idle', days:[]})),
    bonus: bonus.map(b=>({id:uid(), text:b[0], tier:b[1], count:b[2], state:'idle'})),
    specialMission:null,
    stageThresholds: STAGE_THRESHOLDS.slice(),
    completedLog: [],
    weekly:{weekKey:getWeekKey(new Date()), targetPoints:40, reward:weeklyReward, progressPoints:0, harvested:false},
    monthly:{monthKey:getMonthKey(new Date()), targetPoints:150, reward:monthlyReward, progressPoints:0, harvested:false},
    harvestHistory:[]
  };
}

const DEFAULT_STATE = {
  parentPin:'9999', mode:null, activeChild:null, lastResetDate: todayKey(),
  pendingQueue: [],
  children:{
    c1: defaultChild('1111','이름','','tree',
      [['자기주도 학습 30분',2,1],['방 정리하기',1,1],['스마트폰 사용시간 지키기',1,1],['샤워하고 잠자리 정리',1,1]],
      [['설거지 도와드리기',3,1],['동생 숙제 봐주기',2,1]], 3000, 15000),
    c2: defaultChild('2222','이름','','succulent',
      [['숙제하기',2,1],['책 읽기 20분',1,1],['양치 아침저녁 하기',1,1],['장난감 정리하기',1,1]],
      [['식탁 차리기 도와드리기',2,1],['화분에 물 주기',1,1]], 2000, 10000)
  }
};

let state=null;
let pendingUpload=null;
let useMode=null; // {cid, tier}

async function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw===null) throw new Error('no saved data');
    state=JSON.parse(raw);
  }catch(e){
    state=JSON.parse(JSON.stringify(DEFAULT_STATE));
    await persist();
  }
  checkRollovers();
  render();
}
async function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('저장 실패', e); showToast('저장 공간이 가득 찼어요. 오래된 사진 기록을 정리해보세요.'); }
}

function checkRollovers(){
  Object.values(state.children).forEach(c=>{ if(!c.stageThresholds) c.stageThresholds=STAGE_THRESHOLDS.slice(); if(c.affectionCount===undefined) c.affectionCount=0; });
  const today=todayKey();
  const wk=getWeekKey(new Date());
  const mk=getMonthKey(new Date());
  let changed=false;
  if(state.lastResetDate!==today){
    Object.values(state.children).forEach(c=>{ c.tasks.forEach(t=>{ if(t.state==='done') t.state='idle'; }); });
    state.lastResetDate=today; changed=true;
  }
  Object.values(state.children).forEach(c=>{
    if(c.weekly.weekKey!==wk){ c.weekly.weekKey=wk; c.weekly.progressPoints=0; c.weekly.harvested=false; changed=true; }
    if(c.monthly.monthKey!==mk){
      c.monthly.monthKey=mk; c.monthly.progressPoints=0; c.monthly.harvested=false;
      c.points=0;
      changed=true;
    }
  });
  if(changed) persist();
}

function stageOf(points, thresholds){ thresholds=thresholds||STAGE_THRESHOLDS; let s=0; for(let i=0;i<thresholds.length;i++){ if(points>=thresholds[i]) s=i; } return s; }
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2000);
}
function spawnConfetti(originEl,count){
  if(!originEl) return;
  const rect=originEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const colors=['#2FA36B','#FFC24B','#FF7B72','#22B8A6','#3FA9D6'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.style.position='fixed'; el.style.top='0'; el.style.left='0'; el.style.width='9px'; el.style.height='9px';
    el.style.pointerEvents='none'; el.style.zIndex='96'; el.style.borderRadius='2px';
    const angle=Math.random()*Math.PI*2, dist=60+Math.random()*90;
    const x1=Math.cos(angle)*dist, y1=Math.sin(angle)*dist-40;
    el.animate([
      {transform:`translate(${cx}px,${cy}px) rotate(0deg) scale(1)`, opacity:1},
      {transform:`translate(${cx+x1}px,${cy+y1+140}px) rotate(${Math.random()*540-270}deg) scale(.6)`, opacity:0}
    ], {duration:900+Math.random()*500, easing:'linear'});
    el.style.background=colors[i%colors.length];
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}
function spawnEmojiBurst(originEl, emoji, count){
  if(!originEl) return;
  const rect=originEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let i=0;i<count;i++){
    const el=document.createElement('span');
    el.textContent=emoji;
    el.style.position='fixed'; el.style.top='0'; el.style.left='0'; el.style.pointerEvents='none'; el.style.zIndex='96';
    el.style.fontSize=(16+Math.random()*10)+'px';
    const angle=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    const x1=Math.cos(angle)*dist, y1=Math.sin(angle)*dist-60;
    el.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.5)`, opacity:1},
      {transform:`translate(${cx+x1}px,${cy+y1}px) scale(1.1)`, opacity:0}
    ], {duration:1000+Math.random()*400, easing:'ease-out'});
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}
function starBurst(originEl, count){
  if(!originEl) return;
  const rect=originEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const stars=['⭐','✨','🌟'];
  for(let i=0;i<count;i++){
    const angle=(i/count)*Math.PI*2;
    const dist=90+Math.random()*40;
    const x1=Math.cos(angle)*dist, y1=Math.sin(angle)*dist;
    const el=document.createElement('span');
    el.textContent=stars[i%stars.length];
    el.style.position='fixed'; el.style.top='0'; el.style.left='0'; el.style.pointerEvents='none'; el.style.zIndex='96';
    el.style.fontSize=(14+Math.random()*8)+'px';
    el.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.2)`, opacity:1},
      {transform:`translate(${cx+x1}px,${cy+y1}px) scale(1.3)`, opacity:0}
    ], {duration:550+Math.random()*150, easing:'cubic-bezier(.2,.8,.4,1)'});
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }
}
function ribbonRain(count){
  const colors=['#FF7B72','#FFC24B','#22B8A6','#3FA9D6','#2FA36B'];
  const w=window.innerWidth;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='ribbon-piece';
    el.style.left=(Math.random()*w)+'px';
    el.style.background=colors[i%colors.length];
    el.style.animationDuration=(1000+Math.random()*500)+'ms';
    el.style.animationDelay=(Math.random()*250)+'ms';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1900);
  }
}
function ringPulse(originEl){
  if(!originEl) return;
  const rect=originEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const colors=['#FFC24B','#22B8A6','#FF7B72'];
  colors.forEach((col,i)=>{
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='ring-pulse';
      el.style.left=cx+'px'; el.style.top=cy+'px'; el.style.borderColor=col;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),850);
    }, i*150);
  });
}
function celebrateBurst(el){
  const effects=[
    ()=>spawnConfetti(el,40),
    ()=>starBurst(el,16),
    ()=>ribbonRain(18),
    ()=>{ ringPulse(el); spawnEmojiBurst(el,'✨',10); }
  ];
  effects[Math.floor(Math.random()*effects.length)]();
}

/* ================= login / logout ================= */
document.getElementById('loginPinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitLogin(); });
function submitLogin(){
  const v=document.getElementById('loginPinInput').value.trim();
  const err=document.getElementById('loginPinErr');
  if(v===state.parentPin){
    state.mode='parent'; state.activeChild=Object.keys(state.children)[0];
    finishLogin();
  }else{
    const found=Object.entries(state.children).find(([cid,c])=>c.pin===v);
    if(found){ state.mode='child'; state.activeChild=found[0]; finishLogin(); }
    else{ err.textContent='PIN이 올바르지 않아요'; }
  }
}
function finishLogin(){
  document.getElementById('loginPinInput').value='';
  document.getElementById('loginPinErr').textContent='';
  persist(); render();
}
function logout(){
  state.mode=null; state.activeChild=null; useMode=null;
  persist(); render();
}

/* ================= photo capture ================= */
function openCamera(cid, kind, itemId){
  pendingUpload={cid, kind, itemId};
  document.getElementById('hiddenFileInput').click();
}
document.getElementById('hiddenFileInput').addEventListener('change', async (e)=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file || !pendingUpload) return;
  const upload=pendingUpload; pendingUpload=null;
  try{
    const dataUrl=await compressImage(file);
    await submitProof(upload.cid, upload.kind, upload.itemId, dataUrl);
  }catch(err){ console.error(err); showToast('사진 처리에 실패했어요'); }
});
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const maxDim=480;
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.6));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitProof(cid, kind, itemId, photo){
  const c=state.children[cid];
  let entry=null;
  if(kind==='task'){
    const t=c.tasks.find(x=>x.id===itemId);
    if(!t || t.state!=='idle') return;
    t.state='pending';
    entry={id:uid(), cid, kind, itemId, text:t.text, tier:t.tier, count:t.count, photo, submittedAt:Date.now()};
  }else if(kind==='bonus'){
    const b=c.bonus.find(x=>x.id===itemId);
    if(!b || b.state!=='idle') return;
    b.state='pending';
    entry={id:uid(), cid, kind, itemId, text:b.text, tier:b.tier, count:b.count, photo, submittedAt:Date.now()};
  }else if(kind==='special'){
    if(!c.specialMission || c.specialMission.state!=='active') return;
    c.specialMission.state='pending';
    entry={id:uid(), cid, kind, itemId, text:c.specialMission.text, reward:c.specialMission.reward, photo, submittedAt:Date.now()};
  }
  state.pendingQueue.push(entry);
  await persist();
  closeMissionModal();
  render();
  showToast('제출했어요! 부모님 승인을 기다려요 ⏳');
}

/* ================= approve / reject ================= */
async function approveEntry(entryId){
  const idx=state.pendingQueue.findIndex(x=>x.id===entryId);
  if(idx===-1) return;
  const entry=state.pendingQueue[idx];
  const c=state.children[entry.cid];

  if(entry.kind==='task' || entry.kind==='bonus'){
    if(entry.kind==='task'){ const t=c.tasks.find(x=>x.id===entry.itemId); if(t) t.state='done'; }
    else{ const bi=c.bonus.findIndex(x=>x.id===entry.itemId); if(bi>-1) c.bonus.splice(bi,1); }
    c.items[entry.tier]=(c.items[entry.tier]||0)+entry.count;
    const value=ITEM_DEFS[c.companionType][entry.tier-1].value*entry.count;
    c.weekly.progressPoints+=value; c.monthly.progressPoints+=value;
    c.completedLog.unshift({text:entry.text, tier:entry.tier, count:entry.count, photo:entry.photo, date:new Date().toLocaleDateString('ko-KR'), dateKey:dateKeyOf(new Date()), kind:entry.kind});
  }else if(entry.kind==='special'){
    c.harvestHistory.unshift({period:'special', amount:entry.reward, date:new Date().toLocaleDateString('ko-KR'), text:entry.text});
    c.specialMission=null;
  }
  if(c.completedLog.length>MAX_PHOTO_LOG){
    for(let i=MAX_PHOTO_LOG;i<c.completedLog.length;i++){ c.completedLog[i].photo=null; }
  }
  state.pendingQueue.splice(idx,1);
  await persist(); render();
  showToast(entry.kind==='special' ? `특별미션 승인! 💰${entry.reward.toLocaleString()}원` : '승인 완료! 아이템을 획득했어요');
}
async function rejectEntry(entryId){
  const idx=state.pendingQueue.findIndex(x=>x.id===entryId);
  if(idx===-1) return;
  const entry=state.pendingQueue[idx];
  const c=state.children[entry.cid];
  if(entry.kind==='task'){ const t=c.tasks.find(x=>x.id===entry.itemId); if(t) t.state='idle'; }
  else if(entry.kind==='bonus'){ const b=c.bonus.find(x=>x.id===entry.itemId); if(b) b.state='idle'; }
  else if(entry.kind==='special'){ if(c.specialMission) c.specialMission.state='active'; }
  state.pendingQueue.splice(idx,1);
  await persist(); render();
  showToast('반려했어요. 다시 인증할 수 있어요');
}

/* ================= item use (direct tap) ================= */
async function useItemDirect(cid, tier){
  const c=state.children[cid];
  if((c.items[tier]||0)<=0) return;
  const wasStage=stageOf(c.points, c.stageThresholds);
  c.items[tier]--;
  const value=ITEM_DEFS[c.companionType][tier-1].value;
  c.points += value;
  await persist(); render();
  showUseEffect(cid, tier);
  const nowStage=stageOf(c.points, c.stageThresholds);
  if(nowStage>wasStage){
    setTimeout(()=>{
      const el=document.getElementById('pet-visual-'+cid);

/* ================= weather ================= */
function computeMood(c){
  const now=new Date();
  const dow=((now.getDay()+6)%7)+1;
  const weekExpected=dow/7;
  const weekActual=Math.min(1, c.weekly.progressPoints/c.weekly.targetPoints);
  const weekGap=weekExpected-weekActual;

  const dom=now.getDate();
  const daysInMonth=new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const moExpected=dom/daysInMonth;
  const moActual=Math.min(1, c.monthly.progressPoints/c.monthly.targetPoints);
  const moGap=moExpected-moActual;

  const gap=Math.max(weekGap, moGap);
  const worse = weekGap>=moGap ? 'week' : 'month';
  let mood, reason, request;
  if(gap>0.28){
    mood='sad';
    reason = worse==='week' ? '이번 주 미션 진도가 계획보다 많이 늦었어요' : '이번 달 미션 진도가 계획보다 많이 늦었어요';
    request = worse==='week' ? 'water' : 'nutrient';
  }else if(gap>0.1){
    mood='neutral';
    reason = worse==='week' ? '이번 주 미션이 살짝 늦어지고 있어요' : '이번 달 미션이 살짝 늦어지고 있어요';
    request = worse==='week' ? 'water' : 'nutrient';
  }else{
    mood='happy';
    reason='미션 진도가 순조로워요 ☺️';
    request=null;
  }
  return {mood, reason, request};
}

function clusterCircles(cx, cy, baseR, count, colors){
  const patterns={
    1:[[0,0,1,0]],
    2:[[-baseR*0.5,3,0.82,0],[baseR*0.5,-3,0.82,1]],
    3:[[-baseR*0.62,5,0.72,0],[baseR*0.58,2,0.78,1],[0,-baseR*0.55,0.85,0]],
    4:[[-baseR*0.7,6,0.62,0],[baseR*0.66,3,0.68,1],[0,-baseR*0.6,0.8,0],[baseR*0.25,-baseR*0.15,0.55,1]]
  };
  const pat=patterns[Math.min(count,4)];
  return pat.map(([ox,oy,rf,ci])=>`<circle cx="${cx+ox}" cy="${cy+oy}" r="${baseR*rf}" fill="${colors[ci%colors.length]}"/>`).join('');
}
function flowerClusterSmall(cx, cy, n){
  const positions=[[-12,-2],[11,-4],[0,-11],[17,4],[-15,6]];
  let html='';
  for(let i=0;i<n;i++){
    const [dx,dy]=positions[i];
    const fx=cx+dx, fy=cy+dy;
    html+=`<g class="flower-dot-2d" style="animation-delay:${i*0.22}s;">
      <circle cx="${fx-1.6}" cy="${fy}" r="1.4" fill="#fff"/><circle cx="${fx+1.6}" cy="${fy}" r="1.4" fill="#fff"/>
      <circle cx="${fx}" cy="${fy-1.6}" r="1.4" fill="#fff"/><circle cx="${fx}" cy="${fy+1.6}" r="1.4" fill="#fff"/>
      <circle cx="${fx}" cy="${fy}" r="1.2" fill="#FFC24B"/></g>`;
  }
  return html;
}

/* ---- species toppers (local coords, anchored around 100,45; grow via the body's own scale) ---- */
function topperTree(idx){
  const col=FOLIAGE_2D[Math.min(idx+1,4)], colDark=FOLIAGE_2D_DARK[Math.min(idx+1,4)];
  const baseR=[11,13,15,17][idx];
  let html=clusterCircles(100,45,baseR,Math.min(idx+1,4),[col,colDark]);
  if(idx>=2) html+=flowerClusterSmall(100,45, idx===3?5:3);
  return html;
}
function topperSucculent(idx){
  const colors=PLANT_HEAD_COLORS.succulent;
  const baseR=[10,12,14,16][idx];
  const count=idx+3;
  let html='';
  for(let i=0;i<count;i++){
    const ang=(i/count)*Math.PI*2+idx*0.3;
    const ox=Math.cos(ang)*baseR*0.5, oy=45+Math.sin(ang)*baseR*0.32;
    const rf=0.55+(i%2)*0.1;
    html+=`<ellipse cx="${100+ox}" cy="${oy}" rx="${baseR*rf}" ry="${baseR*rf*0.72}" fill="${colors[i%colors.length]}"/>`;
  }
  html+=`<ellipse cx="100" cy="45" rx="${baseR*0.5}" ry="${baseR*0.4}" fill="${colors[0]}"/>`;
  if(idx===3) html+=`<circle cx="100" cy="${45-baseR*0.9}" r="${baseR*0.16}" fill="#FF8FAE"/>`;
  return html;
}
function topperCactus(idx){
  const colors=PLANT_HEAD_COLORS.cactus;
  const col=colors[idx];
  const colH=[14,18,21,24][idx];
  const colW=[7,8,9,10][idx];
  const colTop=45-colH;
  let html=`<rect x="${100-colW/2}" y="${colTop}" width="${colW}" height="${colH}" rx="${colW*0.42}" fill="${col}"/>`;
  const armCount=idx;
  for(let i=0;i<armCount;i++){
    const side=i%2===0?-1:1;
    const ay=colTop+colH*0.35+i*colH*0.2;
    const armW=colW*0.6, armH=colH*0.4;
    const ax=100+side*(colW/2+armW*0.3);
    html+=`<rect x="${ax-armW/2}" y="${ay-armH}" width="${armW}" height="${armH}" rx="${armW*0.4}" fill="${col}"/>`;
  }
  if(idx===3) html+=`<circle cx="100" cy="${colTop}" r="${colW*0.4}" fill="#FF8FAE"/>`;
  return html;
}
function topperSunflower(idx){
  let html='';
  if(idx<2){
    const budR=[6,8][idx];
    html=`<ellipse cx="100" cy="45" rx="${budR*0.75}" ry="${budR}" fill="${FOLIAGE_2D[idx+1]}"/>`;
  }else{
    const petalLen=idx===2?6:8;
    const petalCount=idx===2?8:12;
    const centerR=idx===2?7:10;
    const col=PLANT_HEAD_COLORS.sunflower[idx];
    for(let i=0;i<petalCount;i++){
      const ang=(i/petalCount)*Math.PI*2;
      const px=100+Math.cos(ang)*(centerR+petalLen*0.6), py=45+Math.sin(ang)*(centerR+petalLen*0.6);
      html+=`<ellipse cx="${px}" cy="${py}" rx="${petalLen}" ry="${petalLen*0.42}" fill="${col}" transform="rotate(${ang*180/Math.PI} ${px} ${py})"/>`;
    }
    html+=`<circle cx="100" cy="45" r="${centerR}" fill="#7A4B27"/>`;
  }
  return html;
}
function topperRose(idx){
  const colors=PLANT_HEAD_COLORS.rose;
  let html='';
  if(idx===0){
    html=`<circle cx="100" cy="45" r="7" fill="${colors[4]}"/><circle cx="100" cy="45" r="4" fill="${colors[3]}"/>`;
  }else if(idx===1){
    html=`<circle cx="100" cy="45" r="9" fill="${colors[3]}"/><circle cx="98" cy="43" r="5.5" fill="${colors[2]}"/><circle cx="102" cy="47" r="5" fill="${colors[4]}"/>`;
  }else{
    const layers=idx===2?2:3;
    const petalCounts=[6,8,10];
    for(let l=0;l<layers;l++){
      const ring=9+l*4.5;
      const n=petalCounts[l];
      const col=colors[Math.max(0,3-l)];
      for(let i=0;i<n;i++){
        const ang=(i/n)*Math.PI*2+l*0.3;
        const px=100+Math.cos(ang)*ring, py=45+Math.sin(ang)*ring*0.7;
        html+=`<circle cx="${px}" cy="${py}" r="${5-l*0.8}" fill="${col}"/>`;
      }
    }
    html+=`<circle cx="100" cy="45" r="5" fill="${colors[0]}"/>`;
  }
  return html;
}
function topperTomato(idx){
  const colors=PLANT_HEAD_COLORS.tomato;
  const col=colors[idx];
  const tomatoColor='#E14F4F';
  const topR=[10,12,14,15][idx];
  let html=`<circle cx="100" cy="45" r="${topR}" fill="${col}"/>`;
  const branchCount=idx;
  for(let i=0;i<branchCount;i++){
    const ang=-0.9+i*(1.8/Math.max(1,branchCount-1||1));
    const bx=100+Math.sin(ang)*16, by=41+Math.cos(ang)*6;
    html+=`<line x1="100" y1="45" x2="${bx}" y2="${by}" stroke="#6FA84F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${bx}" cy="${by}" r="5.5" fill="${col}"/>`;
    if(idx>=2) html+=`<circle cx="${bx+(i%2?2.5:-2.5)}" cy="${by+2.5}" r="3.4" fill="${tomatoColor}"/>`;
  }
  if(idx>=2){
    const n=idx===3?3:1;
    const pos=[[-5,-2],[6,-5],[-2,5]];
    for(let i=0;i<n;i++){
      const [dx,dy]=pos[i];
      html+=`<circle cx="${100+dx}" cy="${45+dy}" r="3.4" fill="${tomatoColor}"/>`;
    }
  }
  return html;
}
const TOPPER_BUILDERS={
  tree:topperTree, succulent:topperSucculent, cactus:topperCactus,
  sunflower:topperSunflower, rose:topperRose, tomato:topperTomato
};
function sproutTopperLocal(species){
  const col=(PLANT_HEAD_COLORS[species]||PLANT_HEAD_COLORS.tree)[0];
  return `<rect x="97" y="30" width="6" height="18" rx="3" fill="#6FA84F"/>
    <ellipse cx="88" cy="30" rx="11" ry="7" fill="${col}" transform="rotate(-20 88 30)"/>
    <ellipse cx="112" cy="30" rx="11" ry="7" fill="${col}" transform="rotate(20 112 30)"/>`;
}

const APEX_Y_BY_STAGE=[130,112,94,74,52,30];
const WIDTH_HALF_BY_STAGE=[17,22,28,35,43,52];
const TOPPER_SCALE_BY_STAGE=[1,1.2,1.5,1.9,2.3,2.6];
const BODY_BOTTOM_Y=175;

function bodyPathD(apexY, bottomY, wHalf){
  const midY1=apexY+(bottomY-apexY)*0.30;
  const midY2=apexY+(bottomY-apexY)*0.62;
  const w1=wHalf*0.85;
  return `M100,${apexY}
    C${100+w1*1.05},${apexY} ${100+wHalf},${midY1} ${100+wHalf},${midY2}
    C${100+wHalf},${bottomY-(bottomY-apexY)*0.10} ${100+wHalf*0.6},${bottomY} 100,${bottomY}
    C${100-wHalf*0.6},${bottomY} ${100-wHalf},${bottomY-(bottomY-apexY)*0.10} ${100-wHalf},${midY2}
    C${100-wHalf},${midY1} ${100-w1*1.05},${apexY} 100,${apexY} Z`;
}

function plantSvg2D(species, stage, mood){
  const [light,dark]=BODY_COLORS[species]||BODY_COLORS.tree;
  const gid='bg-'+species+'-'+stage;
  const hasFace=stage>=1;
  const apexY=APEX_Y_BY_STAGE[stage];
  const bottomY=BODY_BOTTOM_Y;
  const wHalf=WIDTH_HALF_BY_STAGE[stage];

  let topperHtml='';
  if(stage===1) topperHtml=sproutTopperLocal(species);
  else if(stage>=2){
    const idx=stage-2;
    const builder=TOPPER_BUILDERS[species]||TOPPER_BUILDERS.tree;
    topperHtml=builder(idx);
  }
  const topperScale=TOPPER_SCALE_BY_STAGE[stage];

  const hemR=wHalf*0.26;
  const hemOffsets=[-0.62,-0.2,0.2,0.62];
  const hemCircles=hemOffsets.map(f=>`<circle cx="${100+f*wHalf}" cy="${bottomY}" r="${hemR}" fill="url(#${gid})"/>`).join('');

  const eyeY=apexY+(bottomY-apexY)*0.5;
  const cheekY=eyeY+wHalf*0.32;
  const cheekDX=wHalf*0.62;
  const glossY=apexY+(bottomY-apexY)*0.16;

  const body=`
    <defs>
      <radialGradient id="${gid}" cx="35%" cy="26%" r="78%">
        <stop offset="0%" stop-color="${light}"/>
        <stop offset="100%" stop-color="${dark}"/>
      </radialGradient>
      <filter id="shBlur-${species}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <ellipse cx="100" cy="${bottomY+3}" rx="${wHalf*1.15}" ry="${Math.max(6,wHalf*0.2)}" fill="#000" opacity="0.14" filter="url(#shBlur-${species})"/>
    ${hemCircles}
    <path d="${bodyPathD(apexY,bottomY,wHalf)}" fill="url(#${gid})"/>
    <ellipse cx="${100-wHalf*0.42}" cy="${glossY}" rx="${wHalf*0.34}" ry="${wHalf*0.2}" fill="#ffffff" opacity="0.32" transform="rotate(-18 ${100-wHalf*0.42} ${glossY})"/>
    ${hasFace?`<ellipse cx="${100-cheekDX}" cy="${cheekY}" rx="${wHalf*0.24}" ry="${wHalf*0.16}" fill="#F5A868" opacity=".5"/><ellipse cx="${100+cheekDX}" cy="${cheekY}" rx="${wHalf*0.24}" ry="${wHalf*0.16}" fill="#F5A868" opacity=".5"/>`:''}
    ${hasFace?faceSvg(100,eyeY,wHalf*0.62,mood):''}
    <g transform="translate(100,${apexY}) scale(${topperScale}) translate(-100,-45)">${topperHtml}</g>`;
  return `<svg viewBox="0 -55 200 255" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">${body}</svg>`;
}

function charSVG(type, stage, mood){
  return plantSvg2D(type, stage, mood);
}

function fxOrbit(cid, emoji, count){
  const el=document.getElementById('pet-visual-'+cid);
  if(!el) return;
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const r=70;
  for(let i=0;i<count;i++){
    const startAngle=(i/count)*Math.PI*2;
    const d=document.createElement('span');
    d.textContent=emoji;
    d.style.cssText='position:fixed;left:0;top:0;z-index:97;pointer-events:none;font-size:15px;';
    document.body.appendChild(d);
    const dur=1300, steps=10, kfs=[];
    for(let s=0;s<=steps;s++){
      const a=startAngle+(s/steps)*Math.PI*2;
      const rr=r*(1-s/steps*0.3);
      kfs.push({transform:'translate('+(cx+Math.cos(a)*rr)+'px,'+(cy+Math.sin(a)*rr*0.5)+'px) scale('+(1-s/steps*0.4)+')', opacity: s<steps?1:0});

    d.animate(kfs, {duration:dur, easing:'linear', fill:'forwards'});
    setTimeout(()=>d.remove(), dur+50);
  }
}

/* ================= calendar ================= */
const WEEKDAY_SHORT=['월','화','수','목','금','토','일'];
let calViewMonth=null; // {year, month(1-12)}
function openCalendarModal(cid){
  const now=new Date();
  calViewMonth={year:now.getFullYear(), month:now.getMonth()+1};
  renderCalendar(cid);
  document.getElementById('missionModal').classList.add('show');
}
function shiftCalMonth(cid, delta){
  let {year, month}=calViewMonth;
  month+=delta;
  if(month<1){ month=12; year--; }
  if(month>12){ month=1; year++; }
  calViewMonth={year, month};
  renderCalendar(cid);
}
function renderCalendar(cid){
  const c=state.children[cid];
  const {year, month}=calViewMonth;
  const firstDow=(new Date(year, month-1, 1).getDay()+6)%7; // 0=Mon
  const daysInMonth=new Date(year, month, 0).getDate();
  const todayKeyStr=dateKeyOf(new Date());

  const countsByDate={};
  c.completedLog.forEach(x=>{ if(x.dateKey){ countsByDate[x.dateKey]=(countsByDate[x.dateKey]||0)+1; } });

  let cells='';
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cnt=countsByDate[key]||0;
    cells+=`<button class="cal-day ${key===todayKeyStr?'today':''}" onclick="openDayDetail('${cid}','${key}')">
      <span>${d}</span>${cnt?`<span class="cdot"></span>`:''}
    </button>`;
  }

  const body=document.getElementById('missionModalBody');
  body.innerHTML=`<div class="modal-head theme-blue"><h3>📅 미션 기록</h3><button class="modal-close" onclick="closeMissionModal()">✕</button></div>
    <div class="modal-body-inner">
      <div class="cal-nav">
        <button onclick="shiftCalMonth('${cid}',-1)">‹</button>
        <div class="ym">${year}년 ${month}월</div>
        <button onclick="shiftCalMonth('${cid}',1)">›</button>
      </div>
      <div class="cal-grid">
        ${WEEKDAY_SHORT.map(w=>`<div class="cal-dow">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="empty-note" style="margin-top:10px;">초록 점이 있는 날짜를 눌러보면 그날 승인된 미션을 볼 수 있어요.</div>
    </div>`;
}
function openDayDetail(cid, dateKey){
  const c=state.children[cid];
  const done=c.completedLog.filter(x=>x.dateKey===dateKey);
  const dow=dowOfDateKey(dateKey);
  const doneTaskTexts=done.filter(x=>x.kind==='task').map(x=>x.text);
  const scheduledTasks=c.tasks.filter(t=> !t.days || t.days.length===0 || t.days.includes(dow));
  const missedTasks=scheduledTasks.filter(t=> !doneTaskTexts.includes(t.text));

  const doneHTML=done.map(x=>{
    const def=ITEM_DEFS[c.companionType]?.[x.tier-1];
    return `<div class="cal-day-detail-item">✅ ${escapeHTML(x.text)} ${def?`<span class="task-pts">${def.icon}×${x.count}</span>`:''}</div>`;
  }).join('');
  const missHTML=missedTasks.map(t=>`<div class="cal-day-detail-item miss">⬜ ${escapeHTML(t.text)}</div>`).join('');

  }else if(kind==='special'){

    else{

          ${isPending

  }
  document.getElementById('missionModal').classList.add('show');
}

function render(){
  if(state.mode===null){
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('appShell').style.display='none';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='block';

  const topBar=document.getElementById('topBar');
  const mainArea=document.getElementById('mainArea');

  if(state.mode==='child'){
    const c=state.children[state.activeChild];
    topBar.innerHTML=`<div class="top-left"><span class="role-chip">${escapeHTML(c.name)}${c.grade?' · '+escapeHTML(c.grade):''}</span></div>
      <button class="logout-btn" onclick="logout()">로그아웃</button>`;
    mainArea.innerHTML=childBoardHTML(state.activeChild, c);
  }else{
    topBar.innerHTML=`<div class="top-left"><span class="role-chip">🔐 부모 모드</span>
        <div class="parent-tabs">${Object.entries(state.children).map(([cid,c])=>{
          const pend=state.pendingQueue.filter(p=>p.cid===cid).length;
          return `<button class="parent-tab ${state.activeChild===cid?'active':''}" onclick="switchParentTab('${cid}')">${escapeHTML(c.name)}${pend?` · ${pend}`:''}</button>`;
        }).join('')}</div>
      </div>
      <button class="logout-btn" onclick="logout()">로그아웃</button>`;
    mainArea.innerHTML=parentBoardHTML(state.activeChild, state.children[state.activeChild]);
  }
}
function switchParentTab(cid){ state.activeChild=cid; persist(); render(); }

function childBoardHTML(cid,c){
  const stage=stageOf(c.points, c.stageThresholds);
  const names=STAGE_NAMES_BY_TYPE[c.companionType];
  const thresholds=c.stageThresholds||STAGE_THRESHOLDS;
  const nextThresh=thresholds[Math.min(stage+1,thresholds.length-1)];
  const prevThresh=thresholds[stage];
  const isMax=stage===STAGE_THRESHOLDS.length-1;
  const pct=isMax?100:Math.round(((c.points-prevThresh)/(nextThresh-prevThresh))*100);
  const accent = cid==='c1' ? '#FF7B72' : '#22B8A6';

  const mood = computeMood(c);
  const needText = mood.request==='water' ? `${ITEM_DEFS[c.companionType][0].icon} ${ITEM_DEFS[c.companionType][0].label} 주세요!` : mood.request==='nutrient' ? `${ITEM_DEFS[c.companionType][1].icon} ${ITEM_DEFS[c.companionType][1].label} 주세요!` : '';

  const wk=c.weekly, mo=c.monthly;
  const wkReady=wk.progressPoints>=wk.targetPoints && !wk.harvested;
  const moReady=mo.progressPoints>=mo.targetPoints && !mo.harvested;

  const items=ITEM_DEFS[c.companionType];
  const todayDowNow=todayDow();
  const pendingTaskCount=c.tasks.filter(t=>(!t.days||t.days.length===0||t.days.includes(todayDowNow)) && t.state==='idle').length;
  const pendingBonusCount=c.bonus.length;
  const specialActive = c.specialMission && c.specialMission.state!=='pending';
  const specialPending = c.specialMission && c.specialMission.state==='pending';

  return `
  <div class="card">
    <div class="grow-scene" id="grow-scene-${cid}">
      <div class="bokeh" style="width:70px;height:70px;left:8%;top:8%;background:#BFE3A0;"></div>
      <div class="bokeh" style="width:44px;height:44px;left:78%;top:14%;background:#FFE49A;"></div>
      <div class="bokeh" style="width:56px;height:56px;left:70%;top:34%;background:#BEE6F5;"></div>
      <div class="bokeh" style="width:34px;height:34px;left:14%;top:38%;background:#F6A9B8;"></div>
      <div class="points-chip">🐾 ${c.points}P</div>
      ${needText ? `<div class="need-bubble">${needText}</div>` : ''}
      ${(wkReady||moReady) ? `<button class="harvest-fab" onclick="harvest('${cid}','${wkReady?'weekly':'monthly'}')" title="용돈 수확하기">💰</button>` : ''}

      <div class="gauge-vert">
        <div class="gv-icon">⭐</div>
        <div class="gv-num">${c.points}</div>
        <div class="gv-track"><div class="gv-fill" style="height:${pct}%;"></div></div>
        <div class="gv-label">${isMax?'최고 단계':(nextThresh-c.points)+'P 남음'}</div>
      </div>

      <div class="icon-stack">
        <button class="icon-stack-btn" onclick="openMissionModal('${cid}','task')">💧<span class="lbl">물받기</span>${pendingTaskCount?'<span class="dot"></span>':''}</button>
        <button class="icon-stack-btn" onclick="openMissionModal('${cid}','bonus')">🌿<span class="lbl">영양제</span>${pendingBonusCount?'<span class="dot"></span>':''}</button>
        <button class="icon-stack-btn" onclick="openMissionModal('${cid}','special')" ${(!specialActive&&!specialPending)?'disabled':''}>🍀<span class="lbl">행운</span>${specialPending?'<span class="dot"></span>':''}</button>
        <button class="icon-stack-btn" onclick="openTypeModal('${cid}')">🌱<span class="lbl">식물변경</span></button>
        <button class="icon-stack-btn" onclick="openCalendarModal('${cid}')">📅<span class="lbl">기록</span></button>
      </div>

      <div class="grow-table"></div>
      <div class="pot-wrap">
        <div class="pet-visual ${isMax?'glow':''}" id="pet-visual-${cid}" onclick="tapCharacter('${cid}')">
          <div class="glow-bg"></div>
          <div class="char-sprite type-${c.companionType}" id="char-sprite-${cid}">${charSVG(c.companionType, stage, mood.mood)}</div>
          <div class="fx-layer" id="fx-layer-${cid}"></div>
        </div>
        <div class="pot-cup"></div>
      </div>
    </div>

    <div class="level-name-row">
      <span class="level-star">⭐${stage+1}</span>
      <div class="companion-name">${escapeHTML(c.customName)}</div>
      <button class="rename-btn" onclick="renameCompanion('${cid}')">✏️</button>
    </div>
    <div class="weather-reason-sm">${mood.reason} · 눌러서 관심주기 <span id="affection-count-${cid}">${(c.affectionCount||0)}회</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; color:${accent}; background-color:${accent};"></div></div>
    <div class="progress-text">${isMax?'최고 단계 달성!':pct+'% · '+(nextThresh-c.points)+'P 남음'}</div>

    <div class="action-bar-4">
      ${items.map((def,i)=>{
        const tier=i+1;
        const cnt=c.items[tier]||0;
        return `<button class="action-btn ${tier===1?'primary':''}" onclick="useItemDirect('${cid}',${tier})" ${cnt<=0?'disabled':''}>
          <div class="ic">${def.icon}</div><div class="n">${cnt}개</div><div class="l">${def.label}</div>
        </button>`;
      }).join('')}
    </div>
  </div>

  <div class="card">
    <div class="goal-card" style="border-color:${wkReady?'var(--sun)':'var(--line)'};">
      <div class="goal-head"><div class="goal-title">📅 이번 주 미션</div><div class="goal-reward">${wk.reward.toLocaleString()}원</div></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.round(wk.progressPoints/wk.targetPoints*100))}%; color:var(--teal); background-color:var(--teal);"></div></div>
      <div class="progress-text">${wk.progressPoints} / ${wk.targetPoints}포인트 달성</div>
      <button class="harvest-btn ${wk.harvested?'done':(wkReady?'ready':'')}" onclick="harvest('${cid}','weekly')" ${(!wkReady)?'disabled':''}>
        ${wk.harvested?'✅ 이번 주 수확 완료':(wkReady?'💰 용돈 수확하기':'목표 달성 시 수확 가능')}
      </button>
    </div>
    <div class="goal-card" style="border-color:${moReady?'var(--sun)':'var(--line)'}; margin-top:12px;">
      <div class="goal-head"><div class="goal-title">🗓️ 이번 달 미션</div><div class="goal-reward">${mo.reward.toLocaleString()}원</div></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.round(mo.progressPoints/mo.targetPoints*100))}%; color:var(--coin); background-color:var(--coin);"></div></div>
      <div class="progress-text">${mo.progressPoints} / ${mo.targetPoints}포인트 달성</div>
      <button class="harvest-btn ${mo.harvested?'done':(moReady?'ready':'')}" onclick="harvest('${cid}','monthly')" ${(!moReady)?'disabled':''}>
        ${mo.harvested?'✅ 이번 달 수확 완료':(moReady?'💰 용돈 수확하기':'목표 달성 시 수확 가능')}
      </button>
    </div>

    <div class="mission-btn-row">
      <button class="mission-btn" onclick="openMissionModal('${cid}','task')">📋 오늘의 할 일${pendingTaskCount?`<span class="cnt">${pendingTaskCount}</span>`:''}</button>
      <button class="mission-btn bonus" onclick="openMissionModal('${cid}','bonus')">⭐ 추가 미션${pendingBonusCount?`<span class="cnt">${pendingBonusCount}</span>`:''}</button>
      ${specialActive||specialPending ? `<button class="mission-btn special" onclick="openMissionModal('${cid}','special')">🎁 특별 미션${specialPending?'<span class="cnt">대기</span>':''}</button>` : ''}
    </div>
  </div>`;
}

function parentBoardHTML(cid,c){
  const myPending=state.pendingQueue.filter(p=>p.cid===cid);
  const pendingHTML=myPending.map(p=>{
    const def = p.kind!=='special' ? ITEM_DEFS[c.companionType][p.tier-1] : null;
    return `
    <div class="pending-card">
      ${p.photo?`<img class="pending-thumb" src="${p.photo}">`:'<div class="pending-thumb"></div>'}
      <div class="pending-info">
        <div class="pending-name">${escapeHTML(c.name)} · ${p.kind==='task'?'오늘의 할 일':p.kind==='bonus'?'추가 미션':'특별 미션'}</div>
        <div class="pending-text">${escapeHTML(p.text)} ${p.kind==='special'?`<span class="task-pts">💰${p.reward.toLocaleString()}원</span>`:`<span class="task-pts">${def.icon}×${p.count}</span>`}</div>
        <div class="pending-actions">
          <button class="approve-btn" onclick="approveEntry('${p.id}')">✓ 승인</button>
          <button class="reject-btn" onclick="rejectEntry('${p.id}')">반려</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const items=ITEM_DEFS[c.companionType];
  const taskMgmt=c.tasks.map(t=>{
    const dayLabel = (!t.days || t.days.length===0) ? '매일' : t.days.slice().sort((a,b)=>a-b).map(d=>WEEKDAY_LABELS[d-1]).join('');
    return `<li class="task-item"><div class="task-text">${escapeHTML(t.text)} <span style="color:var(--ink-soft); font-size:11.5px; font-weight:700;">(${dayLabel})</span></div><div class="task-pts">${items[t.tier-1].icon}×${t.count}</div>
      <button class="del-btn" onclick="removeTask('${cid}','${t.id}')">✕</button></li>`;
  }).join('');
  const bonusMgmt=c.bonus.map(b=>`
    <li class="task-item bonus-item"><div class="task-text">${escapeHTML(b.text)}</div><div class="task-pts">${items[b.tier-1].icon}×${b.count}</div>
      <button class="del-btn" onclick="removeBonus('${cid}','${b.id}')">✕</button></li>`).join('');

  const historyHTML=c.harvestHistory.slice(0,10).map(h=>{
    const label = h.period==='weekly'?'주간 수확':h.period==='monthly'?'월간 수확':'특별미션 '+escapeHTML(h.text||'');
    return `💰 ${label} · ${h.amount.toLocaleString()}원 · ${h.date}`;
  }).join('<br>');
  const logHTML=c.completedLog.slice(0,10).map(x=>`✅ ${escapeHTML(x.text)} · ${x.date}`).join('<br>');

  const mo2=computeMood(c);
  const moodLabel={happy:'😊 행복',neutral:'😐 보통',sad:'😢 시무룩'}[mo2.mood];

  return `
  <div class="card">
    <div class="section-title">🔔 승인 대기함 <span class="badge-count">${myPending.length}</span></div>
    ${pendingHTML || '<div class="empty-note">대기 중인 인증이 없어요.</div>'}
    <button class="save-btn" style="margin-top:10px;" onclick="openCalendarModal('${cid}')">📅 미션 기록 캘린더 보기</button>
  </div>

  <div class="card">
    <div class="section-title">🙂 현재 상태</div>
    <div class="empty-note">${escapeHTML(c.customName)} (${COMPANION_LABEL[c.companionType]}) · ${moodLabel} · ${mo2.reason}</div>
  </div>

  <div class="card">
    <div class="section-title">🌱 어떤 식물을 키울까요? <span class="badge-count" style="background:#EAF6FB; color:var(--sky);">아이도 변경 가능</span></div>
    <div class="type-picker">
      ${PLANT_SPECIES_LIST.map(ty=>`<div class="type-opt ${c.companionType===ty?'sel':''}" onclick="setCompanionType('${cid}','${ty}')"><span class="e">${COMPANION_EMOJI[ty]}</span>${COMPANION_LABEL[ty]}</div>`).join('')}
    </div>
  </div>

  <div class="card">
    <div class="section-title">🎯 주간·월간 목표 설정 (포인트 기준)</div>
    <div class="settings-grid">
      <div><label>주간 목표 (포인트)</label><input type="number" id="wkTarget-${cid}" value="${c.weekly.targetPoints}" min="1"></div>
      <div><label>주간 용돈 (원)</label><input type="number" id="wkReward-${cid}" value="${c.weekly.reward}" min="0" step="500"></div>
      <div><label>월간 목표 (포인트)</label><input type="number" id="moTarget-${cid}" value="${c.monthly.targetPoints}" min="1"></div>
      <div><label>월간 용돈 (원)</label><input type="number" id="moReward-${cid}" value="${c.monthly.reward}" min="0" step="500"></div>
    </div>
    <button class="save-btn" onclick="saveGoals('${cid}')">목표 저장</button>
    <div class="empty-note" style="margin-top:6px;">1단계 아이템=1점, 2단계=5점, 3단계=10점 · 성장 포인트는 매달 1일에 초기화돼요.</div>
  </div>

  <div class="card">
    <div class="section-title">🌱 성장 단계별 목표 포인트</div>
    <div class="settings-grid">
      ${[1,2,3,4,5].map(i=>`<div><label>${STAGE_NAMES_BY_TYPE[c.companionType][i]}</label><input type="number" id="stage${i}-${cid}" value="${(c.stageThresholds||STAGE_THRESHOLDS)[i]}" min="1"></div>`).join('')}
    </div>
    <button class="save-btn" onclick="saveStageThresholds('${cid}')">단계 목표 저장</button>
    <div class="empty-note" style="margin-top:6px;">키우기 대상을 바꿔도 포인트는 유지되고 같은 단계로 보여요.</div>
  </div>

  <div class="card">
    <div class="section-title">🎁 특별 미션</div>
    ${c.specialMission
      ? `<div class="special-box"><div style="font-weight:800;">${escapeHTML(c.specialMission.text)}</div><div class="amt">💰 ${c.specialMission.reward.toLocaleString()}원</div>
          <div class="empty-note">${c.specialMission.state==='pending'?'아이가 인증을 제출했어요. 승인 대기함을 확인하세요.':'진행 중이에요.'}</div>
          ${c.specialMission.state!=='pending' ? `<button class="reject-btn" style="margin-top:8px;" onclick="cancelSpecialMission('${cid}')">미션 취소</button>` : ''}
        </div>`
      : `<div class="add-row">
          <input type="text" id="specText-${cid}" placeholder="목표 (예: 2주간 지각 없이 등교하기)">
          <input type="number" id="specReward-${cid}" placeholder="보상금액" min="0" step="500" style="width:110px;">
          <button onclick="setSpecialMission('${cid}')">등록</button>
        </div>`}
  </div>

  <div class="card">
    <div class="section-title">📋 오늘의 할 일 관리</div>
    <ul class="task-list">${taskMgmt || '<li class="empty-note">등록된 할 일이 없어요.</li>'}</ul>
    <div class="add-row">
      <input type="text" id="newTask-${cid}" placeholder="새 할 일 입력">
      ${tierPickerHTML('newTask-'+cid, 1)}
      <input type="number" id="newTaskCnt-${cid}" value="1" min="1" max="10" title="개수">
      <button onclick="addTask('${cid}')">추가</button>
    </div>
    <div class="empty-note" style="margin:2px 0 6px;">요일을 선택하면 그 요일에만 나타나요 (선택 안 하면 매일)</div>
    <div class="add-row">${dayPickerHTML('newTask-'+cid)}</div>
    <div class="divider"></div>
    <div class="section-title">⭐ 추가 미션 관리</div>
    <ul class="task-list">${bonusMgmt || '<li class="empty-note">등록된 추가 미션이 없어요.</li>'}</ul>
    <div class="add-row">
      <input type="text" id="newBonus-${cid}" placeholder="새 추가 미션 입력">
      ${tierPickerHTML('newBonus-'+cid, 2)}
      <input type="number" id="newBonusCnt-${cid}" value="1" min="1" max="10" title="개수">
      <button onclick="addBonus('${cid}')">추가</button>
    </div>
  </div>

  ${c.harvestHistory.length? `<div class="card"><div class="section-title">💰 수확 내역</div><div class="history-log">${historyHTML}</div></div>` : ''}
  ${c.completedLog.length? `<div class="card"><div class="section-title">🗓️ 최근 승인 기록</div><div class="history-log">${logHTML}</div></div>` : ''}

  <div class="card">
    <div class="section-title">👤 자녀 정보 수정</div>
    <div class="settings-grid">
      <div><label>이름</label><input type="text" id="childName-${cid}" maxlength="8" value="${escapeHTML(c.name)}"></div>
      <div><label>학년</label><input type="text" id="childGrade-${cid}" maxlength="14" placeholder="예: 중학교 2학년" value="${escapeHTML(c.grade)}"></div>
    </div>
    <button class="save-btn" onclick="saveChildInfo('${cid}')">정보 저장</button>
  </div>

  <div class="card">
    <div class="section-title">🔑 PIN 관리</div>
    <div class="settings-grid">
      <div><label>부모 PIN</label><input type="password" id="parentPinInput" inputmode="numeric" maxlength="6" value="${state.parentPin}"></div>
      <div><label>첫째 PIN</label><input type="password" id="c1PinInput" inputmode="numeric" maxlength="6" value="${state.children.c1.pin}"></div>
      <div><label>둘째 PIN</label><input type="password" id="c2PinInput" inputmode="numeric" maxlength="6" value="${state.children.c2.pin}"></div>
    </div>
    <button class="save-btn" onclick="savePins()">PIN 저장</button>
    <div id="pinSaveMsg" style="font-size:12.5px; font-weight:700; margin-top:8px;"></div>
  </div>

  <div class="card">
    <div class="section-title">📁 데이터 백업 · 기기 이동</div>
    <div class="empty-note">기기를 바꾸실 땐, 새 기기에서 이 페이지를 열고 "백업 불러오기"로 아래 파일을 선택하면 이어서 사용할 수 있어요.</div>
    <div class="add-row" style="margin-top:10px;">
      <button onclick="exportBackup()">⬇️ 백업 파일 내보내기</button>
      <button onclick="triggerImportBackup()">⬆️ 백업 불러오기</button>
    </div>
  </div>`;
}

loadState();
</script>
</body>
</html>
